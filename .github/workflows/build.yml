name: Build desktop client (Tauri + Velopack)

on:
  # Раньше собирали под все 3 ОС на каждый push — GitHub Actions даёт
  # ограниченный бесплатный пакет минут на приватных репо в месяц, а
  # macOS/Windows-раннеры съедают его в 10x/2x быстрее обычного (см.
  # CHANGELOG v0.4.1 — упёрлись в лимит после серии пушей за день).
  # Теперь автосборка идёт только когда меняется VERSION — то есть
  # реально готовим релиз, а не на любую правку CI/доков/README.
  # Собрать вне этого — вручную, кнопкой "Run workflow" (workflow_dispatch).
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch: {}

jobs:
  build:
    # Только Windows — раньше собирали под 3 ОС параллельно, но
    # одновременные джобы регулярно ловили гонку при создании релиза.
    # Один джоб — гонки просто неоткуда взяться.
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # vpk (упаковщик Velopack) — .NET-инструмент, windows-latest
      # обычно уже несёт нужный SDK, но явный setup надёжнее, чем
      # рассчитывать на то, что осталось в образе раннера сейчас.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Версия релиза из VERSION
        shell: bash
        run: echo "PKG_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      # VERSION — единственный источник версии; tauri.conf.json/Cargo.toml/
      # dist/app/settings.js (APP_VERSION, показывается в диалоге
      # "Настройки" — раньше жил в dist/app.js, файл раздроблен на модули,
      # см. dist/app/*.js) подставляются отсюда прямо перед сборкой, чтобы
      # номер в самих именах файлов установщиков и в самом приложении
      # никогда не расходился с тегом релиза (однажды уже разъехалось —
      # v0.3.0 собрал файлы "...0.2.0...", а APP_VERSION вообще не
      # патчился и годами показывал версию последней ручной правки).
      - name: Подставить версию в tauri.conf.json/Cargo.toml/settings.js
        shell: bash
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '${{ env.PKG_VERSION }}';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
          sed -i.bak -E 's/^version = \"[0-9.]+\"/version = \"${{ env.PKG_VERSION }}\"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          sed -i.bak -E 's/const APP_VERSION = \"[0-9.]+\"/const APP_VERSION = \"${{ env.PKG_VERSION }}\"/' dist/app/settings.js
          rm -f dist/app/settings.js.bak

      # ffmpeg нужен для локального QC звука — раньше требовался в PATH
      # у пользователя, теперь кладём готовый статичный бинарник прямо
      # в установщик (src-tauri/binaries/ffmpeg.exe рядом с .exe в
      # pack_dir/, см. шаг vpk pack ниже). В git лежит только текстовый
      # плейсхолдер (иначе даже `cargo check` падает — resources
      # tauri.conf.json проверялись на каждой сборке, пока модуль не
      # ушёл на Velopack-упаковку — плейсхолдер оставлен и сейчас, чтобы
      # не плодить разные версии файла между ветками) — тут подменяем
      # его настоящим.
      #
      # Источник — закреплённый (не "latest", иммутабельный) релиз
      # BtbN/FFmpeg-Builds, статичная LGPL-сборка (без GPL-кодеков —
      # нам для QC нужно только декодирование, лицензионно чище).
      # SHA256 зафиксирован — если апстрим когда-нибудь переиздаст
      # файл под тем же именем с другим содержимым, сборка упадёт
      # явной ошибкой, а не тихо подсунет что-то другое.
      - name: Скачать и проверить статичный ffmpeg.exe
        shell: bash
        run: |
          set -e
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-14-13-17/ffmpeg-n9.0.1-29-gad500d59cb-win64-lgpl-9.0.zip"
          expected_sha256="084874559d629b29cea0cae5b4d3cbb8e384d323f4eb3f1835bd9705d83bf58"
          curl -sL --max-time 180 -o ffmpeg.zip "$url"
          actual_sha256=$(sha256sum ffmpeg.zip | cut -d' ' -f1)
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::SHA256 не совпал — ожидали $expected_sha256, получили $actual_sha256"
            exit 1
          fi
          unzip -q ffmpeg.zip -d ffmpeg_extracted
          find ffmpeg_extracted -iname "ffmpeg.exe" -exec cp {} src-tauri/binaries/ffmpeg.exe \;
          rm -rf ffmpeg.zip ffmpeg_extracted
          test -s src-tauri/binaries/ffmpeg.exe || { echo "::error::ffmpeg.exe не найден в архиве"; exit 1; }

      - name: cargo build --release
        shell: bash
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # Velopack вместо tauri-action+NSIS: GithubSource на клиенте читает
      # релизы репозитория напрямую (репозиторий публичный), тихая
      # установка без UAC, задел на дельта-патчи между версиями. Пакуем
      # в чистую директорию — Cargo кладёт рядом с .exe в target/release
      # служебные файлы сборки (deps/, build/, .fingerprint/ и т.п.),
      # которые vpk пытался бы упаковать вместе с приложением, если
      # указать target/release как есть. ffmpeg.exe — тем же способом,
      # рядом с главным .exe (см. audio_qc.rs: resolve_ffmpeg() ищет
      # его именно рядом с исполняемым файлом приложения).
      - name: Собрать релиз через vpk
        shell: bash
        run: |
          set -e
          dotnet tool update -g vpk
          mkdir -p pack_dir
          cp src-tauri/target/release/project-desktop.exe pack_dir/
          cp src-tauri/binaries/ffmpeg.exe pack_dir/
          echo "Автосборка из main (commit ${{ github.sha }})." > release_notes.md
          vpk pack \
            --packId ProjectDesktop \
            --packVersion "${{ env.PKG_VERSION }}" \
            --packDir pack_dir \
            --mainExe project-desktop.exe \
            --packTitle "Project Desktop" \
            --icon src-tauri/icons/icon.ico \
            --releaseNotes release_notes.md \
            --outputDir release_output

      - name: Опубликовать релиз на GitHub
        shell: bash
        run: |
          set -e
          vpk upload github \
            --outputDir release_output \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --publish \
            --tag "v${{ env.PKG_VERSION }}" \
            --releaseName "PROJECT v${{ env.PKG_VERSION }}"
