name: Build desktop client (Tauri + Velopack)

on:
  # Раньше собирали под все 3 ОС на каждый push — GitHub Actions даёт
  # ограниченный бесплатный пакет минут на приватных репо в месяц, а
  # macOS/Windows-раннеры съедают его в 10x/2x быстрее обычного (см.
  # CHANGELOG v0.4.1 — упёрлись в лимит после серии пушей за день).
  # Теперь автосборка идёт только когда меняется VERSION — то есть
  # реально готовим релиз, а не на любую правку CI/доков/README.
  # Собрать вне этого — вручную, кнопкой "Run workflow" (workflow_dispatch).
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch: {}

jobs:
  build:
    # Только Windows — раньше собирали под 3 ОС параллельно, но
    # одновременные джобы регулярно ловили гонку при создании релиза.
    permissions:
      contents: write
    runs-on: windows-latest
    # Одна группа с build-alpha.yml: «один джоб — гонки неоткуда взяться»
    # верно только внутри этого workflow. Push, меняющий VERSION, — это
    # push в main, то есть build-alpha.yml стартует на него ТОЖЕ, и оба
    # запуска одновременно делают `vpk upload github` в один репозиторий
    # (а он читает и дописывает общий список релизов). Очередь вместо
    # параллели; не отменяем уже идущую публикацию — оборваться на
    # середине заливки хуже, чем подождать.
    concurrency:
      # Своя очередь: общая с альфой вытесняла ожидающий запуск —
      # GitHub держит в группе только один pending. Релизы и фиды разные
      # (vX.Y.Z/releases.win.json и alpha-latest/releases.alpha.json),
      # так что параллельно они друг другу не мешают.
      group: velopack-stable
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # vpk (упаковщик Velopack) — .NET-инструмент, windows-latest
      # обычно уже несёт нужный SDK, но явный setup надёжнее, чем
      # рассчитывать на то, что осталось в образе раннера сейчас.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # Node 24 — активная LTS (поддержка до апреля 2028). На 20 CI стоять
      # больше не может: линия EOL с апреля 2026, а devDependency jsdom
      # (его использует scripts/verify-modules.mjs) с 30.x требует
      # ^22.22.2 || ^24.15.0 || >=26.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Версия релиза из VERSION
        shell: bash
        run: echo "PKG_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      # VERSION — единственный источник версии. tauri.conf.json/Cargo.toml
      # подставляются отсюда прямо перед сборкой, чтобы номер в именах
      # файлов установщиков не расходился с тегом релиза (однажды уже
      # разъехалось — v0.3.0 собрал файлы "...0.2.0...").
      # Номер, который приложение показывает в «Настройках», больше здесь
      # не патчится: его подставляет сам Vite (define __APP_VERSION__ в
      # vite.config.js читает VERSION, а в CI — переменную PKG_VERSION
      # ниже), поэтому и локальная сборка показывает правду.
      - name: Подставить версию в tauri.conf.json/Cargo.toml
        shell: bash
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '${{ env.PKG_VERSION }}';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
          sed -i.bak -E 's/^version = \"[0-9.]+\"/version = \"${{ env.PKG_VERSION }}\"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      # Фронтенд теперь собирается Vite (src/ -> dist/, см. историю
      # миграции vanilla JS -> Vite/Solid) — раньше dist/ был готовыми
      # файлами прямо в git, отдельного шага сборки не требовалось.
      # Обязательно ПОСЛЕ подстановки версии выше — иначе в собранный
      # бандл попадёт версия из settings.js как она лежит в git.
      # PKG_VERSION виден Vite как process.env.PKG_VERSION — см.
      # vite.config.js, define __APP_VERSION__.
      - name: npm ci, lint && vite build
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

      # ffmpeg нужен для локального QC звука — раньше требовался в PATH
      # у пользователя, теперь кладём готовый статичный бинарник прямо
      # в установщик (src-tauri/binaries/ffmpeg.exe рядом с .exe в
      # pack_dir/, см. шаг vpk pack ниже). В git лежит только текстовый
      # плейсхолдер (иначе даже `cargo check` падает — resources
      # tauri.conf.json проверялись на каждой сборке, пока модуль не
      # ушёл на Velopack-упаковку — плейсхолдер оставлен и сейчас, чтобы
      # не плодить разные версии файла между ветками) — тут подменяем
      # его настоящим.
      #
      # Источник — закреплённый (не "latest", иммутабельный) релиз
      # BtbN/FFmpeg-Builds, статичная LGPL-сборка (без GPL-кодеков —
      # нам для QC нужно только декодирование, лицензионно чище).
      # SHA256 зафиксирован — если апстрим когда-нибудь переиздаст
      # файл под тем же именем с другим содержимым, сборка упадёт
      # явной ошибкой, а не тихо подсунет что-то другое.
      - name: Скачать и проверить статичный ffmpeg.exe
        shell: bash
        run: |
          set -e
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-14-13-17/ffmpeg-n9.0.1-29-gad500d59cb-win64-lgpl-9.0.zip"
          expected_sha256="0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbf8bb49b5"
          curl -sL --max-time 180 -o ffmpeg.zip "$url"
          actual_sha256=$(sha256sum ffmpeg.zip | cut -d' ' -f1)
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::SHA256 не совпал — ожидали $expected_sha256, получили $actual_sha256"
            exit 1
          fi
          unzip -q ffmpeg.zip -d ffmpeg_extracted
          find ffmpeg_extracted -iname "ffmpeg.exe" -exec cp {} src-tauri/binaries/ffmpeg.exe \;
          # ffprobe.exe — из того же архива, тот же SHA256 уже проверен выше
          # (один zip на оба бинарника). Нужен инструментам ffmpeg (media_tools.rs:
          # probe_media/probe_keyframes) — сам ffmpeg.exe вывод -show_streams
          # не отдаёт, это отдельная утилита из того же дистрибутива.
          find ffmpeg_extracted -iname "ffprobe.exe" -exec cp {} src-tauri/binaries/ffprobe.exe \;
          rm -rf ffmpeg.zip ffmpeg_extracted
          test -s src-tauri/binaries/ffmpeg.exe || { echo "::error::ffmpeg.exe не найден в архиве"; exit 1; }
          test -s src-tauri/binaries/ffprobe.exe || { echo "::error::ffprobe.exe не найден в архиве"; exit 1; }

      # mpv — настоящий видеоплеер внутри «Обрезки» (media-tools.js,
      # mpv_embed.rs): встроен как нативное окно (--wid), не браузерный
      # <video> — тот не декодирует HEVC/ProRes и т.п. без системных
      # кодеков. Источник — тот же принцип, что у ffmpeg.exe выше:
      # закреплённый (не "latest") дистрибутив с проверкой SHA256, чтобы
      # апстрим не мог тихо подменить содержимое под тем же именем.
      # d3dcompiler_43.dll лежит в архиве рядом и обязателен для рендер-
      # бэкенда mpv — без него mpv.exe не запускается на части систем.
      # 7-Zip на windows-latest идёт предустановленным (`7z` в PATH) —
      # если это когда-нибудь перестанет быть так, здесь понадобится
      # `choco install 7zip` шагом раньше.
      - name: Скачать и проверить статичный mpv.exe
        shell: bash
        run: |
          set -e
          url="https://sourceforge.net/projects/mpv-player-windows/files/64bit/mpv-x86_64-20260830-git-e8673660ab.7z/download"
          expected_sha256="464ab69b2248e7b592f0c27a927ffd1f016f7fa2d6d8b46b1a98254c5f2b670a"
          curl -sL --max-time 180 -o mpv.7z "$url"
          actual_sha256=$(sha256sum mpv.7z | cut -d' ' -f1)
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::SHA256 не совпал — ожидали $expected_sha256, получили $actual_sha256"
            exit 1
          fi
          7z x mpv.7z -ompv_extracted mpv.exe d3dcompiler_43.dll
          cp mpv_extracted/mpv.exe src-tauri/binaries/mpv.exe
          cp mpv_extracted/d3dcompiler_43.dll src-tauri/binaries/d3dcompiler_43.dll
          rm -rf mpv.7z mpv_extracted
          test -s src-tauri/binaries/mpv.exe || { echo "::error::mpv.exe не найден в архиве"; exit 1; }
          test -s src-tauri/binaries/d3dcompiler_43.dll || { echo "::error::d3dcompiler_43.dll не найден в архиве"; exit 1; }

      # PROJECT_UPDATE_TOKEN — fine-grained PAT с доступом только "Public
      # Repositories (read-only)" (см. main.rs: GITHUB_UPDATE_TOKEN,
      # option_env! читает её прямо здесь, во время сборки). Поднимает
      # лимит проверки обновлений с 60/час на IP до 5000/час — секрет
      # заводится владельцем репозитория в Settings → Secrets and
      # variables → Actions, сюда просто передаётся. Если секрет не
      # заведён, переменная пуста, GITHUB_UPDATE_TOKEN в бинарнике — None,
      # сборка просто продолжает работать без токена, как раньше.
      - name: cargo build --release
        shell: bash
        env:
          PROJECT_UPDATE_TOKEN: ${{ secrets.PROJECT_UPDATE_TOKEN }}
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features custom-protocol

      # Velopack вместо tauri-action+NSIS: GithubSource на клиенте читает
      # релизы репозитория напрямую (репозиторий публичный), тихая
      # установка без UAC, задел на дельта-патчи между версиями. Пакуем
      # в чистую директорию — Cargo кладёт рядом с .exe в target/release
      # служебные файлы сборки (deps/, build/, .fingerprint/ и т.п.),
      # которые vpk пытался бы упаковать вместе с приложением, если
      # указать target/release как есть. ffmpeg.exe — тем же способом,
      # рядом с главным .exe (см. audio_qc.rs: resolve_ffmpeg() ищет
      # его именно рядом с исполняемым файлом приложения).
      - name: Собрать релиз через vpk
        shell: bash
        run: |
          set -e
          dotnet tool update -g vpk
          mkdir -p pack_dir
          cp src-tauri/target/release/phoenix-dub-desktop.exe pack_dir/
          cp src-tauri/binaries/ffmpeg.exe pack_dir/
          cp src-tauri/binaries/ffprobe.exe pack_dir/
          cp src-tauri/binaries/mpv.exe pack_dir/
          cp src-tauri/binaries/d3dcompiler_43.dll pack_dir/
          echo "Автосборка из main (commit ${{ github.sha }})." > release_notes.md
          vpk pack \
            --packId PhoenixDubDesktop \
            --packVersion "${{ env.PKG_VERSION }}" \
            --packDir pack_dir \
            --mainExe phoenix-dub-desktop.exe \
            --packTitle "Project Desktop" \
            --icon src-tauri/icons/icon.ico \
            --releaseNotes release_notes.md \
            --outputDir release_output

      - name: Опубликовать релиз на GitHub
        shell: bash
        run: |
          set -e
          vpk upload github \
            --outputDir release_output \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --publish \
            --tag "v${{ env.PKG_VERSION }}" \
            --releaseName "Project v${{ env.PKG_VERSION }}"

      # Та же страховка, что и в build-alpha.yml: vpk умеет выйти с кодом
      # 0, оставив релиз черновиком — сборка зелёная, а обновления никто
      # не видит, потому что черновик не отдаётся публичным API.
      - name: Проверить, что релиз опубликован
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          tag="v${{ env.PKG_VERSION }}"
          id=$(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name==\"$tag\") | .id" | head -1)
          if [ -z "$id" ]; then
            echo "::error::Релиза $tag нет вообще"
            exit 1
          fi
          if [ "$(gh api "repos/$REPO/releases/$id" --jq .draft)" = "true" ]; then
            echo "::warning::vpk оставил релиз черновиком — публикуем сами"
            gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false
          fi
          url="https://github.com/$REPO/releases/download/$tag/releases.win.json"
          for i in 1 2 3; do
            if curl -fsSL -o feed_check.json "$url"; then
              echo "Фид стабильного канала доступен:"
              cat feed_check.json
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::releases.win.json недоступен по $url — клиенты обновление не увидят"
          exit 1
