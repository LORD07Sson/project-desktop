name: Build desktop client (alpha channel)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

jobs:
  build-alpha:
    permissions:
      contents: write
    runs-on: windows-latest
    concurrency:
      group: velopack-alpha
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: vpk-${{ runner.os }}-v1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Версия альфа-сборки
        shell: bash
        run: |
          short_sha="$(echo "${{ github.sha }}" | cut -c1-8)"
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          next="$(awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}' VERSION)"
          echo "PKG_VERSION=$next-alpha.${{ github.run_number }}+$short_sha" >> "$GITHUB_ENV"

      - name: Подставить версию в tauri.conf.json/Cargo.toml
        shell: bash
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '${{ env.PKG_VERSION }}';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
          sed -i.bak -E 's/^version = \"[0-9.]+\"/version = \"${{ env.PKG_VERSION }}\"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

      - name: npm ci && vite build
        shell: bash
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      - uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: |
            src-tauri/binaries/ffmpeg.exe
            src-tauri/binaries/ffprobe.exe
          key: ffmpeg-N-127271-32b374c9

      - name: Скачать и проверить статичный ffmpeg.exe
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          url="https://github.com/LORD07Sson/project-desktop/releases/download/tools-ffmpeg-N-127271/ffmpeg-N-127271-gba987fe24d-win64-lgpl.zip"
          expected_sha256="32b374c9831ae5640e33977baa4cf04a59704f616a0c3743654697fb3c7f26de"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --max-time 300 -o ffmpeg.zip "$url"
          actual_sha256="$(sha256sum ffmpeg.zip | cut -d' ' -f1)"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::SHA256 не совпал — ожидали $expected_sha256, получили $actual_sha256"
            exit 1
          fi
          unzip -t -q ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg_extracted
          find ffmpeg_extracted -iname "ffmpeg.exe" -exec cp {} src-tauri/binaries/ffmpeg.exe \;
          find ffmpeg_extracted -iname "ffprobe.exe" -exec cp {} src-tauri/binaries/ffprobe.exe \;
          rm -rf ffmpeg.zip ffmpeg_extracted
          test -s src-tauri/binaries/ffmpeg.exe || { echo "::error::ffmpeg.exe не найден в архиве"; exit 1; }
          test -s src-tauri/binaries/ffprobe.exe || { echo "::error::ffprobe.exe не найден в архиве"; exit 1; }

      - name: cargo build --release
        shell: bash
        env:
          PROJECT_UPDATE_CHANNEL: alpha
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Собрать альфа-канал через vpk
        shell: bash
        run: |
          set -e
          dotnet tool update -g vpk || dotnet tool install -g vpk
          export PATH="$HOME/.dotnet/tools:$PATH"
          mkdir -p pack_dir
          cp src-tauri/target/release/project-desktop.exe pack_dir/
          cp src-tauri/binaries/ffmpeg.exe pack_dir/
          cp src-tauri/binaries/ffprobe.exe pack_dir/
          echo "Альфа-сборка из main (commit ${{ github.sha }}) — тестовая, может быть менее стабильной." > release_notes.md
          vpk pack \
            --packId ProjectDesktop \
            --packVersion "${{ env.PKG_VERSION }}" \
            --packDir pack_dir \
            --mainExe project-desktop.exe \
            --packTitle "Project Desktop" \
            --icon src-tauri/icons/icon.ico \
            --releaseNotes release_notes.md \
            --channel alpha \
            --outputDir release_output

      - name: Опубликовать альфа-релиз на GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          cleanup_alpha_latest() {
            local ids
            ids=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name=="alpha-latest") | .id')
            for id in $ids; do
              echo "Удаляю релиз alpha-latest (id=$id)"
              gh api -X DELETE "repos/$REPO/releases/$id"
            done
            gh api -X DELETE "repos/$REPO/git/refs/tags/alpha-latest" >/dev/null 2>&1 || true
          }

          publish() {
            cleanup_alpha_latest
            vpk upload github \
              --outputDir release_output \
              --repoUrl "https://github.com/$REPO" \
              --token "$GH_TOKEN" \
              --channel alpha \
              --publish \
              --pre \
              --tag alpha-latest \
              --releaseName "Project alpha (${{ env.SHORT_SHA }})"
          }

          for i in 1 2 3; do
            publish && break
            echo "попытка $i не удалась" >&2
            if [ "$i" = "3" ]; then exit 1; fi
            sleep $((i * 5))
          done

      - name: Проверить, что альфа-релиз опубликован
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # The release list lags a few seconds behind a just-created release: retry before calling it missing.
          for i in 1 2 3 4 5 6; do
            rels=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name=="alpha-latest") | "\(.id) \(.draft)"')
            [ -n "$rels" ] && break
            sleep 10
          done
          if [ -z "$rels" ]; then
            echo "::error::Релиза alpha-latest нет вообще"
            exit 1
          fi
          published=$(echo "$rels" | awk '$2=="false"{print $1; exit}')
          drafts=$(echo "$rels" | awk '$2=="true"{print $1}')
          if [ -n "$published" ]; then
            for d in $drafts; do
              echo "::warning::Удаляю лишний черновик alpha-latest (id=$d)"
              gh api -X DELETE "repos/$REPO/releases/$d" || true
            done
          else
            id=$(echo "$drafts" | head -1)
            echo "::warning::vpk оставил релиз черновиком — публикуем сами"
            gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -F prerelease=true
            for d in $(echo "$drafts" | tail -n +2); do gh api -X DELETE "repos/$REPO/releases/$d" || true; done
          fi
          url="https://github.com/$REPO/releases/download/alpha-latest/releases.alpha.json"
          for i in 1 2 3; do
            if curl -fsSL -o feed_check.json "$url"; then
              echo "Фид альфа-канала доступен:"
              cat feed_check.json
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::releases.alpha.json недоступен по $url — клиенты обновление не увидят"
          exit 1
