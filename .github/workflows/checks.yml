name: Checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: npm lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  rust:
    name: cargo check + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Собрать фронтенд для tauri::generate_context!
        shell: bash
        run: |
          npm ci
          npm run build

      - name: cargo check
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --features custom-protocol

      - name: cargo test
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml
