[package]
name = "project-desktop"
version = "0.6.0"
description = "Project Desktop — клиент студии дубляжа"
edition = "2021"
# `[T]::as_chunks` в audio_qc.rs стабилизирован в 1.88 — на более
# старом тулчейне сборка падает с невнятной ошибкой про нестабильную фичу.
rust-version = "1.88"

# Без этой фичи tauri сам решает, что грузить, по debug/release-сборке —
# а точнее НЕ решает: без custom-protocol он всегда пытается открыть
# tauri.conf.json -> build.devUrl (Vite dev-сервер), даже в --release,
# если сборка идёт напрямую cargo build (как в build.yml/build-alpha.yml),
# а не через cargo-tauri CLI (тот сам подставляет этот флаг под капотом
# для `tauri build`, но не для `tauri dev` — тут именно так и нужно).
# Без флага собранный .exe у пользователя пытается открыть
# http://localhost:1420 и падает с ERR_CONNECTION_REFUSED — там же нет
# никакого Vite dev-сервера, это не окно разработчика.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Автообновление — Velopack вместо tauri-plugin-updater+NSIS-инсталлятора:
# GithubSource читает релизы репозитория напрямую (он публичный, прокси
# на своём сервере не нужен), тихая установка без UAC, задел на дельта-
# патчи вместо полного скачивания каждый раз. См. main.rs.
velopack = "1.2.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Загрузка файла, перетащенного из проводника, и скачивание вложений
# (upload_report_file/download_report_file в main.rs) — HTTP на свой API
# напрямую из Rust, минуя JS/fetch: не нужен tauri-plugin-fs, а токен
# уходит заголовком, а не в строке URL. Путь на диске команда берёт не
# на веру: читать можно только то, что пользователь сам перетащил в
# окно (см. DroppedFiles в main.rs).
# rustls вместо native-tls — не тащит системный OpenSSL на сборку.
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[[bin]]
name = "project-desktop"
path = "src/main.rs"
