[package]
name = "project-desktop"
version = "0.4.2"
description = "Project Desktop — клиент студии дубляжа"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Автообновление — Velopack вместо tauri-plugin-updater+NSIS-инсталлятора:
# GithubSource читает релизы репозитория напрямую (он публичный, прокси
# на своём сервере не нужен), тихая установка без UAC, задел на дельта-
# патчи вместо полного скачивания каждый раз. См. main.rs.
velopack = "1.2.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[[bin]]
name = "project-desktop"
path = "src/main.rs"
